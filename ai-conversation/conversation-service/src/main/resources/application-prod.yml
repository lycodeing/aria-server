# ============================================================
# conversation-service 生产环境配置（Docker 容器内）
# 通过 SPRING_PROFILES_ACTIVE=prod 激活
# 仅覆盖与本地开发不同的值，其余继承 application.yml
# ============================================================

spring:
  datasource:
    url: jdbc:postgresql://ai-cs-postgres:5432/aria_cs

# Sa-Token JWT 密钥与 auth-service 保持一致
# 【安全】生产密钥不落库，必须由环境变量注入；未配置则启动失败（fail-fast），禁止硬编码兜底
sa-token:
  jwt-secret-key: ${JWT_SECRET_KEY}

aria:
  auth:
    client:
      base-url: http://ai-cs-auth:8083
      shared-secret: ${ARIA_INTERNAL_SECRET}
  internal:
    secret: ${ARIA_INTERNAL_SECRET}

knowledge:
  client:
    sharedSecret: ${ARIA_INTERNAL_SECRET}
  service:
    base-url: http://ai-cs-knowledge:8081

app:
  cors:
    allowed-origins: https://chat.lycodeing.cn
