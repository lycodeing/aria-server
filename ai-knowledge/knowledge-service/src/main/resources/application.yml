spring:
  application:
    name: aria-knowledge
  autoconfigure:
    exclude:
      # knowledge-service 本身不需要通过 SDK 调用自己，排除客户端自动装配
      - com.aria.sdk.knowledge.KnowledgeClientAutoConfig
  datasource:
    url: jdbc:postgresql://localhost:5432/aria_knowledge
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      # 防止开发环境休眠后连接失效：定期发送 keepalive 查询
      keepalive-time: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

  # -------- RabbitMQ（文档摄取队列，替换原 Redis Streams） --------
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 心跳间隔：每 60s 发送心跳，防止 NAT/OS 因 TCP 空闲杀掉连接
    # 直接效果：消除 "Socket closed" + "Failed to check/redeclare auto-delete queue(s)" 日志
    requested-heartbeat: 60
    # Publisher Confirms — Broker 持久化确认后才返回，保障发布端可靠性
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 消费端重试 3 次失败后 nack(requeue=false) → DLX → DLQ
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aria.knowledge.infrastructure.persistence
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"

server:
  port: 8081

# Sa-Token（与 auth-service 共享 JWT 密钥，用于验证管理员 token）
sa-token:
  token-name: Authorization
  timeout: 28800
  token-prefix: "Bearer"
  is-read-header: true
  is-read-cookie: false
  jwt-secret-key: cs-auth-dev-secret-key-change-in-production

# auth-client SDK 配置（拉取 EMBEDDING 模型），共享密钥必须与 auth-service 一致
aria:
  auth:
    client:
      # base-url 本地开发默认值，生产由 application-prod.yml 覆盖
      base-url: http://localhost:8083
      # shared-secret 必填，未配置 SDK 启动即失败（fail-fast）
      shared-secret: aria-internal-lycodeing-2024
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
      max-retries: 2
  # 兼容 knowledge-service 内部其它调用继续读取此密钥
  internal:
    secret: aria-internal-lycodeing-2024

knowledge:
  search:
    # PostgreSQL 全文检索分词配置：
    #   simple — 内置，无需扩展，中文效果差（本地开发默认）
    #   jieba  — 需安装 pg_jieba 扩展，中文分词效果好（生产推荐）
    # 生产环境通过 application-prod.yml 覆盖为 jieba
    fts-config: simple
    # 向量 ANN 召回数量（独立于 topK，BAAI 建议送 Reranker 前 100~200 条）
    recall-k-vector: 80
    # BM25 全文召回数量（BM25 略多，反映中文客服场景的字面匹配需求）
    recall-k-text: 100
    # RRF 融合后送 Reranker 的候选上限（受 GPU 算力约束）
    reranker-candidate-limit: 200
    # RRF 平滑系数 K（40 比默认 60 在 topK=5~20 场景头部区分度更好）
    rrf-k: 40
  # 文档摄取 MQ 配置（RabbitMQ，替换原 Redis Streams 摄取队列）
  ingest:
    exchange: knowledge.doc.ingest
    queue: knowledge.doc.ingest.queue
    dlq: knowledge.doc.ingest.dlq
    routing-key: ingest
    # 主队列消费线程数（同实例并发）
    consumer-concurrency: 2
    # DLQ 消费线程数，DLQ 量级低，单线程足够
    dlq-concurrency: 1
  chunk:
    max-tokens: 512
    overlap-tokens: 50
  embedding:
    # model / base-url / api-key 统一在 auth-service 后台管理（AI 模型配置 → EMBEDDING 类型）
    # 以下为运维调优参数，与模型配置无关
    batch-size: 32
    timeout-seconds: 30
  # Reranker 配置已迁移到 auth-service AI 模型配置（RERANKER 类型），
  # base-url / model-name / api-key 在后台统一管理，支持热切换，无需重启。

# -------- MinIO 对象存储配置 --------
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: ai-knowledge

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
  paths-to-exclude:
    - /internal/**

# =========================================================================
# Actuator 监控 — 仅暴露 /actuator/health 心跳接口，屏蔽其他端点
# =========================================================================
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  # -------- 全链路追踪采样配置 --------
  # probability: 1.0 = 采样全部请求（本地开发），生产建议 0.1（10% 采样）
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.aria: DEBUG
    org.springframework.data.redis: WARN

# -------- 天翼云 AI 配置（用于翻译等管理功能）--------
ctyun:
  ai:
    base-url: https://wishub-x6.ctyun.cn/v1
    api-key: ""
    model: DeepSeek-V4-Flash

# -------- Resilience4j 熔断配置 --------
resilience4j:
  circuitbreaker:
    instances:
      reranker:
        # 滑动窗口大小（最近 20 次调用）
        sliding-window-size: 20
        # 错误率阈值：50% 失败时开路
        failure-rate-threshold: 50
        # 慢调用阈值：超过 5s 视为慢调用（GPU 推理典型超时）
        slow-call-duration-threshold: 5s
        # 慢调用比例阈值：80% 慢调用时开路
        slow-call-rate-threshold: 80
        # 开路后等待 30s 再进入半开状态
        wait-duration-in-open-state: 30s
        # 半开状态允许通过的请求数
        permitted-number-of-calls-in-half-open-state: 3
        # 最小调用数（窗口内至少 5 次调用才计算错误率）
        minimum-number-of-calls: 5
