# ============================================================
# knowledge-service 生产环境配置（Docker 容器内）
# 通过 SPRING_PROFILES_ACTIVE=prod 激活
# 仅覆盖与本地开发不同的值，其余继承 application.yml
# ============================================================

spring:
  datasource:
    url: jdbc:postgresql://ai-cs-postgres:5432/aria_knowledge

# Sa-Token JWT 密钥与 auth-service 保持一致
# 生产密钥一律由环境变量注入，未配置则启动失败（fail-fast），禁止在仓库内硬编码明文
sa-token:
  jwt-secret-key: ${JWT_SECRET_KEY}

aria:
  auth:
    client:
      base-url: http://ai-cs-auth:8083
      shared-secret: ${INTERNAL_SHARED_SECRET}
  internal:
    secret: ${ARIA_INTERNAL_SECRET}

# MinIO 使用容器名访问，凭证由环境变量注入
minio:
  endpoint: http://ai-cs-minio:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ai-knowledge

knowledge:
  search:
    # pg_jieba 中文分词（已安装扩展），配置名为 jiebacfg
    # pg_jieba 注册的 text search configuration 名为 jiebacfg（非 jieba）
    fts-config: jiebacfg

ctyun:
  ai:
    api-key: ""
