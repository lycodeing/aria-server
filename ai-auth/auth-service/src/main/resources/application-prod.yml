# ============================================================
# auth-service 生产环境配置（Docker 容器内）
# 通过 SPRING_PROFILES_ACTIVE=prod 激活
# 仅覆盖与本地开发不同的值，其余继承 application.yml
# ============================================================

spring:
  datasource:
    url: jdbc:postgresql://ai-cs-postgres:5432/aria_cs

# 生产密钥统一由环境变量注入，无默认值：未配置时 InternalSecretVerifier 阻止启动（fail-fast）
aria:
  internal:
    secret: ${ARIA_INTERNAL_SECRET}
